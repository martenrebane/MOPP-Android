name: Coverity scan

on: [push, pull_request]
jobs:
  coverity:
    name: Run Coverity tests
    if: contains(github.repository, 'martenrebane/MOPP-Android') && contains(github.ref, 'coverity_scan')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup environment
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          cd ${{ github.workspace }}/app
          echo -n "$GOOGLE_SERVICES_JSON" | base64 --decode > "google-services.json"
          cd ${{ github.workspace }}
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17

      - name: Install Coverity Scan Tool
        run: |
          curl -o coverity_tool.tgz -L "https://scan.coverity.com/download/linux64"
          tar -xzf coverity_tool.tgz
          export PATH=$PATH:$PWD/cov-analysis-linux64/bin
          
      - name: Build and analyze
        run: |
          cov-build --dir cov-int ./gradlew clean --no-daemon fetchAndPackageDefaultConfiguration assemble --debug --stacktrace

      - name: Package results
        run: tar czvf coverity_results.tgz cov-int

      - name: Upload to Coverity Scan
        run: |
          curl \
            --form token=${{ secrets.COVERITY_SCAN_TOKEN }} \
            --form email=marten.rebane@nortal.com \
            --form file=@coverity_results.tgz \
            --form version="${{ github.sha }}" \
            --form description="GitHub Actions build" \
            https://scan.coverity.com/builds?project=MOPP-Android

      #- name: Build and send to Coverity
